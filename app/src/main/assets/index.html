<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A24" media="(prefers-color-scheme: dark)">
<title>Cyber Master Chef</title>
<style>
:root{
  color-scheme: light;
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E9EDF4; --ink:#17202E; --muted:#5B6678; --line:#D3D9E3;
  --accent:#2459D6; --accent-ink:#FFFFFF; --accent-soft:#C9D7F7;
  --warn:#8A5200; --warn-soft:#FBEBD0; --err:#B3261E; --err-soft:#FADBD8; --ok:#1E7A46;
  --star:#C98A00;
  --mono: ui-monospace, "SF Mono", "Roboto Mono", "Droid Sans Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#141A24; --surface:#1C2431; --surface-2:#253042; --ink:#E6EAF1; --muted:#9AA5B8; --line:#2F3B4F;
    --accent:#7FA6FF; --accent-ink:#0F1622; --accent-soft:#2B3F68;
    --warn:#F2B661; --warn-soft:#3A2E1A; --err:#FF8A80; --err-soft:#3D2023; --ok:#7ED6A0;
    --star:#F2C14E;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.01em;margin:0;min-width:0}
.brand svg{color:var(--accent);flex:none}
.top .meta{margin-left:auto;white-space:nowrap}

main{display:grid;gap:16px;padding:16px;padding-bottom:calc(32px + env(safe-area-inset-bottom));max-width:1280px;margin:0 auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"in" "recipe" "out"}
#inPanel{grid-area:in} #recipePanel{grid-area:recipe} #outPanel{grid-area:out}
@media (min-width:960px){
  main{grid-template-columns:minmax(340px,420px) minmax(0,1fr);grid-template-areas:"recipe in" "recipe out";align-items:start}
  #recipePanel{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.panel-head{display:flex;align-items:center;gap:8px 10px;margin-bottom:10px;min-height:36px;flex-wrap:wrap}
.panel-head h2{font-size:16px;font-weight:650;margin:0}
.meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:550;min-height:36px;cursor:pointer;white-space:nowrap}
.btn:active{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.icon{width:36px;height:36px;display:grid;place-items:center;border:0;background:transparent;border-radius:8px;color:var(--muted);cursor:pointer;flex:none;padding:0}
.icon:hover{background:var(--surface-2);color:var(--ink)}
.icon:disabled{opacity:.3;cursor:default;background:transparent}
.icon[aria-pressed="true"]{color:var(--accent)}

textarea,.out-text{width:100%;font-family:var(--mono);font-size:14px;line-height:1.55;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
textarea{min-height:150px;resize:vertical;display:block}
.out-text{min-height:150px;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-height:65vh;overflow:auto}
.out-text.nowrap{white-space:pre;overflow-wrap:normal}
.out-text:empty::before{content:attr(data-empty);color:var(--muted);font-family:var(--sans)}
.out-html{width:100%;min-height:150px;height:320px;border:1px solid var(--line);border-radius:10px;background:#fff;display:block}

.filecard{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.filecard svg{flex:none;color:var(--accent)}
.filecard .fname{font-weight:600;overflow-wrap:anywhere}
.filecard .meta{display:block}
.filecard .btn{margin-left:auto}

/* The recipe: a vertical pipeline, data flows top to bottom */
.pipe{list-style:none;margin:0;padding:0;position:relative}
.pipe:has(.step + .step)::before{content:"";position:absolute;left:9px;top:22px;bottom:30px;width:2px;background:var(--accent-soft)}
.step{position:relative;padding-left:30px;margin-bottom:10px}
.node{position:absolute;left:3px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);transition:background .15s}
.step.done .node{background:var(--accent)}
.step.off .node{border-style:dashed;border-color:var(--muted);background:var(--surface)}
.step.err .node{background:var(--err);border-color:var(--err)}
.step.bp .node{background:var(--warn);border-color:var(--warn);border-radius:3px}
.step-box{background:var(--surface-2);border-radius:12px;padding:4px 4px 10px 12px}
.step.off .step-box{opacity:.55}
.step.err .step-box{box-shadow:inset 0 0 0 1.5px var(--err)}
.step.paused .step-box{box-shadow:inset 0 0 0 1.5px var(--warn)}
.step-head{display:flex;align-items:center;gap:0}
.step-title{flex:1;min-width:0;padding:6px 0;border:0;background:transparent;text-align:left;cursor:pointer}
.step-name{font-weight:600;font-size:15px;display:block;overflow-wrap:anywhere}
.step-cat{display:block;color:var(--muted);font-size:12px}
.step-err{color:var(--err);font-size:13px;margin:6px 8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.more{position:relative}
.menu{position:absolute;right:0;top:38px;z-index:4;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgb(0 0 0 / .18);padding:6px;display:flex;flex-direction:column}
.menu button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:15px}
.menu button:hover,.menu button:active{background:var(--surface-2)}
.menu button:disabled{opacity:.4}
.args{display:grid;gap:8px;margin-top:4px;padding-right:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.arg{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.arg.wide{grid-column:1/-1}
.arg input:not([type=checkbox]),.arg select,.arg textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px;width:100%;min-width:0}
.arg textarea{min-height:76px;font-family:var(--mono);font-size:14px}
.arg .row{display:flex;gap:6px}
.arg .row input{flex:1}
.arg .row select{width:auto;flex:none;max-width:45%}
.arg.check{flex-direction:row;align-items:center;gap:10px;font-size:14px;color:var(--ink);min-height:42px;cursor:pointer}
.arg.check input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.arg.label-only{grid-column:1/-1;font-weight:650;color:var(--ink);font-size:13px;margin-top:6px}
.add{width:100%;margin-top:2px;padding:12px;border:1.5px dashed var(--accent);border-radius:12px;background:transparent;color:var(--accent);font-weight:650;font-size:15px;cursor:pointer}
.add:active{background:var(--accent-soft)}
.empty{color:var(--muted);font-size:14px;padding:2px 0 12px}
.bakebar{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;color:var(--muted)}
.switch input{width:20px;height:20px;accent-color:var(--accent);margin:0}

.suggest{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.suggest:empty{display:none}
.chip{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;text-align:left}
.chip:active{background:var(--accent-soft)}
.chip small{display:block;font-weight:400;color:var(--muted);font-family:var(--mono);overflow-wrap:anywhere}
.notice{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.notice:empty{display:none}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.err{background:var(--err-soft);color:var(--err)}
.status{color:var(--accent)}

.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgb(10 14 22 / .5)}
.sheet-body{position:relative;width:100%;max-width:640px;height:88vh;background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);animation:up .22s ease-out}
.sheet-body.short{height:auto;max-height:88vh}
@keyframes up{from{transform:translateY(28px);opacity:.5}}
@media (min-width:700px){.sheet{align-items:center}.sheet-body{border-radius:20px;height:80vh}.sheet-body.short{height:auto}}
.sheet-top{padding:10px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.sheet-top h2{margin:0;font-size:18px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet-row{display:flex;gap:8px;align-items:center}
.sheet-row h2{flex:1}
.sheet-main{overflow-y:auto;padding:12px 16px 20px;overscroll-behavior:contain;flex:1}
.search{font:inherit;font-size:16px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-height:44px}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.oplist{overflow-y:auto;padding:4px 8px 20px;overscroll-behavior:contain;flex:1}
.oplist h3{font-size:13px;color:var(--muted);font-weight:600;margin:16px 8px 4px}
.oprow{display:flex;align-items:flex-start;gap:2px;border-radius:10px}
.oprow:hover{background:var(--surface-2)}
.opitem{flex:1;min-width:0;display:block;text-align:left;border:0;background:transparent;padding:10px 8px;border-radius:10px;cursor:pointer}
.opitem b{display:block;font-weight:600;font-size:15px}
.opitem span{display:block;color:var(--muted);font-size:13px;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.oprow .icon{margin-top:6px}
.star[aria-pressed="true"]{color:var(--star)}
.nores{color:var(--muted);padding:20px 8px;font-size:14px}

.doc{font-size:15px;overflow-wrap:anywhere}
.doc a{color:var(--accent)}
.doc code,.doc pre{font-family:var(--mono);font-size:13px;background:var(--surface-2);border-radius:6px;padding:1px 4px}
.doc pre{padding:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.doc h3{font-size:15px;margin:20px 0 6px}
.list{display:flex;flex-direction:column;gap:8px}
.saved{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface-2);border-radius:12px}
.saved div{flex:1;min-width:0}
.saved b{display:block;overflow-wrap:anywhere}
.saved .meta{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);margin-bottom:12px}
.field input,.field textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.field textarea{font-family:var(--mono);font-size:13px;min-height:120px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}

.scan{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:3/4;max-height:60vh;margin:0 auto}
.scan video{width:100%;height:100%;object-fit:cover;display:block}
.scan .frame{position:absolute;inset:18%;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 999px rgb(0 0 0 / .35)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.sheet-body{animation:none}.toast,.node{transition:none}}
</style>
</head>
<body>

<header class="top">
  <h1 class="brand">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M7 14.5V20h10v-5.5"/><path d="M7 14.5a4 4 0 0 1-1.2-7.8A4.5 4.5 0 0 1 12 3.5a4.5 4.5 0 0 1 6.2 3.2 4 4 0 0 1-1.2 7.8z"/><path d="M7 17h10"/></svg>
    Cyber Master Chef
  </h1>
  <span class="meta" id="opCount">Loading…</span>
  <div class="more">
    <button class="icon" id="appMenuBtn" aria-label="Menu" aria-haspopup="true" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
    <div class="menu" id="appMenu" hidden>
      <button data-m="saved">Saved recipes</button>
      <button data-m="import">Load a recipe</button>
      <button data-m="export">Share or export recipe</button>
      <button data-m="about">About &amp; licences</button>
    </div>
  </div>
</header>

<main>
  <section class="panel" id="inPanel" aria-labelledby="inH">
    <div class="panel-head">
      <h2 id="inH">Input</h2>
      <span class="meta" id="inMeta"></span>
      <div class="tools">
        <button class="btn" id="pasteBtn">Paste</button>
        <button class="btn" id="fileBtn">Open file</button>
        <button class="btn" id="scanBtn">Scan QR</button>
        <button class="btn" id="clearInBtn">Clear</button>
      </div>
    </div>
    <textarea id="input" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Type or paste text, a hash, Base64, a timestamp, an IP range…"></textarea>
    <div class="filecard" id="fileCard" hidden>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/></svg>
      <div><span class="fname" id="fileName"></span><span class="meta" id="fileMeta"></span></div>
      <button class="btn" id="removeFileBtn">Remove</button>
    </div>
    <input type="file" id="fileInput" hidden>
  </section>

  <section class="panel" id="recipePanel" aria-labelledby="recH">
    <div class="panel-head">
      <h2 id="recH">Recipe</h2>
      <span class="meta" id="recMeta"></span>
      <div class="tools">
        <button class="btn" id="saveRecBtn">Save</button>
        <button class="btn" id="clearRecBtn">Clear</button>
      </div>
    </div>
    <ol class="pipe" id="recipe"></ol>
    <button class="add" id="addBtn">+ Add operation</button>
    <div class="bakebar">
      <button class="btn primary" id="bakeBtn">Bake</button>
      <label class="switch"><input type="checkbox" id="autoBake" checked> Auto bake</label>
    </div>
  </section>

  <section class="panel" id="outPanel" aria-labelledby="outH">
    <div class="panel-head">
      <h2 id="outH">Output</h2>
      <span class="meta" id="outMeta"></span>
      <div class="tools">
        <button class="btn" id="moveBtn">Move to input</button>
        <button class="btn" id="saveOutBtn">Save file</button>
        <button class="btn" id="shareBtn">Share</button>
        <button class="btn primary" id="copyBtn">Copy</button>
      </div>
    </div>
    <pre class="out-text" id="output" tabindex="0" aria-live="polite" data-empty="The result shows up here."></pre>
    <iframe class="out-html" id="outputHtml" title="Output" hidden></iframe>
    <div class="notice" id="notice"></div>
    <div class="suggest" id="suggest"></div>
  </section>
</main>

<!-- Add operation -->
<div class="sheet" id="opSheet" hidden>
  <div class="backdrop" data-close></div>
  <div class="sheet-body" role="dialog" aria-modal="true" aria-label="Add operation">
    <div class="sheet-top">
      <div class="grab" aria-hidden="true"></div>
      <div class="sheet-row">
        <input class="search" id="search" type="search" placeholder="Search all operations" autocomplete="off" spellcheck="false">
        <button class="btn" data-close>Close</button>
      </div>
      <div class="cats" id="cats" role="toolbar" aria-label="Categories"></div>
    </div>
    <div class="oplist" id="oplist"></div>
  </div>
</div>

<!-- General-purpose sheet: operation help, saved recipes, import/export, about, scanner -->
<div class="sheet" id="infoSheet" hidden>
  <div class="backdrop" data-close></div>
  <div class="sheet-body" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
    <div class="sheet-top">
      <div class="grab" aria-hidden="true"></div>
      <div class="sheet-row"><h2 id="infoTitle"></h2><button class="btn" data-close>Close</button></div>
    </div>
    <div class="sheet-main" id="infoBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
/* =====================================================================
   Phone bridge. On current WebViews this is a message channel that only
   the app's own page can use; older ones get a direct bridge.
   ===================================================================== */
const native = (() => {
  const B = window.AndroidBridge;
  if (!B) return null;
  if (typeof B.postMessage === 'function' && typeof B.call !== 'function') {
    let n = 0; const pending = {};
    B.onmessage = e => {
      let r; try { r = JSON.parse(e.data); } catch { return; }
      const p = pending[r.id]; if (!p) return; delete pending[r.id];
      if (r.error != null) p.reject(new Error(r.error)); else p.resolve(r.value);
    };
    return { secure: true, call: (method, ...args) => new Promise((resolve, reject) => {
      const id = ++n; pending[id] = { resolve, reject };
      B.postMessage(JSON.stringify({ id, method, args }));
    }) };
  }
  return { secure: false, call: (method, ...args) => Promise.resolve(B.call(method, JSON.stringify(args))) };
})();

/* ===================== Small helpers ===================== */
const $ = s => document.querySelector(s);
const el = (tag, props = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(props)) { if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? '' : v); } e.append(...kids.filter(k => k != null)); return e; };
const store = {
  get(k, d) { try { const v = localStorage.getItem('cmc.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('cmc.' + k, JSON.stringify(v)); } catch {} }
};
const TE = new TextEncoder();
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
function plural(n, one, many) { return `${n.toLocaleString()} ${n === 1 ? one : many}`; }
function bytesText(n) { if (n < 1024) return plural(n, 'byte', 'bytes'); const u = ['KB', 'MB', 'GB']; let i = -1; do { n /= 1024; i++; } while (n >= 1024 && i < 2); return `${n.toFixed(n < 10 ? 1 : 0)} ${u[i]}`; }
function stripHtml(h) { const d = document.createElement('div'); d.innerHTML = (h || '').replace(/<br\s*\/?>|<\/(p|li|ul)>/gi, ' '); return (d.textContent || '').replace(/\s+/g, ' ').trim(); }
function b64FromBytes(u8) { let s = ''; for (let i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768)); return btoa(s); }
function bytesFromB64(b) { const s = atob(b); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
function decodeUtf8(u8) { try { return new TextDecoder('utf-8', { fatal: true }).decode(u8); } catch { return null; } }

/* ===================== CyberChef engine ===================== */
const ENGINE = new URL('cyberchef', location.href).href;  // folder holding ChefWorker.js and its modules
let OPS = {}, CATS = [], CC_VERSION = '';
const DEFAULT_FAVS = ['To Base64', 'From Base64', 'To Hex', 'From Hex', 'To Hexdump', 'From Hexdump', 'URL Decode', 'Regular expression', 'Entropy', 'Fork', 'Magic'];
let favs = store.get('favourites', DEFAULT_FAVS);

/** One CyberChef worker. `bake` returns a promise; a newer bake supersedes an older one. */
class Chef {
  constructor(onStatus) { this.onStatus = onStatus; this.seq = 0; this.start(); }
  start() {
    this.worker = new Worker(ENGINE + '/ChefWorker.js');
    this.worker.postMessage({ action: 'docURL', data: ENGINE });
    this.worker.onmessage = e => this.handle(e.data);

    add = best.recipe; label = best.recipe.map(o => o.op).join(' → ');
    preview = String(best.data || '').slice(0, 60);
  } else if (best.fileType && best.fileType.name) {

  } else return;
  suggestEl.innerHTML = '';
  suggestEl.append(el('span', { text: 'Magic suggests:' }));
  const b = el('button', { class: 'chip' }, '✨ ' + label, preview ? el('small', { text: `gives “${preview}${String(best.data || '').length > 60 ? '…' : ''}”` }) : null);
  b.onclick = () => { for (const c of add) if (OPS[c.op]) { recipe.push(makeStep(c.op, c.args)); } afterRecipeChange(); toast('Added ' + label); };
  suggestEl.append(b);
}

/* ===================== Add-operation sheet ===================== */
let activeCat = 'Favourites';
function categories() { return CATS.map(c => c.name === 'Favourites' ? { name: 'Favourites', ops: favs.filter(f => OPS[f]) } : c); }
function renderCats() {
  const c = $('#cats'); c.innerHTML = '';
  for (const name of ['Favourites', 'All', ...CATS.filter(c => c.name !== 'Favourites').map(c => c.name)]) {
    const b = el('button', { class: 'cat', text: name, 'aria-pressed': String(name === activeCat) });
    b.onclick = () => { activeCat = name; renderCats(); renderList(); $('#oplist').scrollTop = 0; }; c.append(b);
  }
}
const descCache = {};
function shortDesc(name) { return descCache[name] ??= stripHtml(OPS[name].description); }
function renderList() {
  const q = $('#search').value.trim().toLowerCase(), list = $('#oplist'); list.innerHTML = '';
  let groups;
  if (q) {
    // Like CyberChef: name matches first, then description matches.
    const names = Object.keys(OPS);
    const byName = names.filter(n => n.toLowerCase().includes(q)).sort((a, b) => a.toLowerCase().indexOf(q) - b.toLowerCase().indexOf(q) || a.localeCompare(b));
    const byDesc = names.filter(n => !byName.includes(n) && shortDesc(n).toLowerCase().includes(q));
    groups = [{ name: '', ops: byName.concat(byDesc) }];
  } else if (activeCat === 'All') groups = categories().filter(c => c.name !== 'Favourites');
  else groups = categories().filter(c => c.name === activeCat);
  const total = groups.reduce((n, g) => n + g.ops.length, 0);
  if (!total) {
    list.append(el('div', { class: 'nores', text: q ? `Nothing matches “${q}”. Try a shorter word, like “base” or “hash”.` : 'No favourites yet. Tap the star next to any operation to add it here.' }));
    return;
  }
  const frag = document.createDocumentFragment();
  for (const g of groups) {

    for (const name of g.ops) {
      if (!OPS[name]) continue;
      const item = el('button', { class: 'opitem' }, el('b', { text: name }), el('span', { text: shortDesc(name) }));
      item.onclick = () => { addStep(name); closeSheets(); toast(`Added ${name}`); };

      const star = el('button', { class: 'icon star', 'aria-label': isFav ? `Remove ${name} from favourites` : `Add ${name} to favourites`, 'aria-pressed': String(isFav) }); star.innerHTML = isFav ? ICON.star : ICON.starOff;
      star.onclick = () => { favs = isFav ? favs.filter(f => f !== name) : favs.concat(name); store.set('favourites', favs); renderList(); };
      const info = el('button', { class: 'icon', 'aria-label': `About ${name}` }); info.innerHTML = ICON.info; info.onclick = () => showOpHelp(name, true);

}

/* ===================== Sheets ===================== */

function closeTop() { const sel = sheetStack.pop(); if (!sel) return false; $(sel).hidden = true; if (sel === '#infoSheet') stopScanner(); return true; }

/* ===================== Saved recipes, import & export ===================== */
function savedList() { return store.get('saved', []); }
async function showSaved() {

  if (!saved.length) wrap.append(el('p', { class: 'meta', text: 'Nothing saved yet. Build a recipe, then press Save in the Recipe panel.' }));

function saveRecipeDialog() {

async function showExport() {
  if (!recipe.length) { toast('Add an operation first'); return; }

  let chefFmt = '';
  try { chefFmt = await chef.prettyRecipe(cfg, false); } catch {}
  const json = JSON.stringify(cfg.map(c => { const o = { op: c.op, args: c.args }; if (c.disabled) o.disabled = true; if (c.breakpoint) o.breakpoint = true; return o; }), null, 2);

function showImport() {
  const area = el('textarea', { spellcheck: 'false', autocapitalize: 'off', placeholder: 'Paste a CyberChef link, chef format (e.g. From_Base64(\'A-Za-z0-9+/=\',true)) or JSON' });
  const go = el('button', { class: 'btn primary', text: 'Load recipe' });
  const paste = el('button', { class: 'btn', text: 'Paste' });
  paste.onclick = async () => { area.value = await readClipboard(); };

    try { const n = await importRecipe(area.value); closeSheets(); toast(`Loaded ${plural(n, 'operation', 'operations')}`); }
    catch (e) { toast(e.message); }

/** Accepts a CyberChef URL (recipe and input), chef format or JSON. Returns the number of operations. */
async function importRecipe(text) {
  text = text.trim(); if (!text) throw new Error('Paste a recipe first');
  let recipeText = text, inputB64 = null;
  const m = text.match(/^https?:\/\/[^#?\s]+[#?](.*)$/s);
  if (m) {
    const params = {};
    for (const part of m[1].split('&')) { const i = part.indexOf('='); if (i > 0) params[part.slice(0, i)] = decodeURIComponent(part.slice(i + 1).replace(/\+/g, '%2B')); }
    if (!params.recipe) throw new Error('That link has no recipe in it');
    recipeText = params.recipe; inputB64 = params.input || null;
  }
  let cfg;
  if (/^\s*[\[{]/.test(recipeText)) { cfg = JSON.parse(recipeText); if (!Array.isArray(cfg)) cfg = [cfg]; }
  else cfg = await chef.parseRecipe(recipeText);
  if (!cfg.length) throw new Error("Couldn't find any operations in that recipe");
  setRecipeConfig(cfg);
  if (inputB64) { try { const bytes = bytesFromB64(inputB64.replace(/-/g, '+').replace(/_/g, '/')); const t = decodeUtf8(bytes); if (t !== null) { clearFile(); inputEl.value = t; } else setFile('input from link', bytes); schedule(); } catch {} }
  return cfg.length;
}

/* ===================== Clipboard, share, files ===================== */
async function readClipboard() {
  if (native) { try { return await native.call('paste'); } catch {} }
  try { return await navigator.clipboard.readText(); } catch { toast('Paste is blocked here. Long-press the box and choose Paste.'); return ''; }
}
async function copyText(t) {
  if (native) { await native.call('copy', t); toast('Copied'); return; }
  try { await navigator.clipboard.writeText(t); toast('Copied'); } catch { toast('Copy is blocked here. Select the text and copy it.'); }
}
async function shareText(t) {
  if (native) { native.call('shareText', t); return; }
  if (navigator.share) { try { await navigator.share({ text: t }); } catch {} return; }
  copyText(t);
}
function outputText() {
  if (out.kind === 'text') return out.text;
  if (out.kind === 'bytes') return hexdump(out.bytes, Infinity);
  if (out.kind === 'html') { const d = document.createElement('div'); d.innerHTML = out.html; return d.innerText || d.textContent || ''; }
  return '';
}
const SIGS = [['89504e47', 'png', 'image/png'], ['ffd8ff', 'jpg', 'image/jpeg'], ['47494638', 'gif', 'image/gif'], ['25504446', 'pdf', 'application/pdf'], ['504b0304', 'zip', 'application/zip'], ['1f8b', 'gz', 'application/gzip'], ['424d', 'bmp', 'image/bmp'], ['7f454c46', 'elf', 'application/octet-stream'], ['4d5a', 'exe', 'application/octet-stream']];
function guessType(u8) {
  const h = Array.from(u8.subarray(0, 8), b => b.toString(16).padStart(2, '0')).join('');
  for (const [sig, ext, mime] of SIGS) if (h.startsWith(sig)) return { ext, mime };
  if (u8.length > 12 && h.startsWith('52494646') && String.fromCharCode(...u8.subarray(8, 12)) === 'WEBP') return { ext: 'webp', mime: 'image/webp' };
  return null;
}
/** The result's real data. For formatted results (images, tables…) this is what the
    operation produced before it was formatted for display, as in CyberChef. */
async function rawOutputBytes() {
  if (out.kind !== 'html') return out.bytes || null;
  try { return new Uint8Array(await chef.dishAs(out.dish, 'ArrayBuffer')); } catch { return TE.encode(out.html); }
}
async function saveOutput() {
  let bytes, name, mime;
  if (out.kind === 'html') {
    bytes = await rawOutputBytes(); const g = guessType(bytes);
    if (g) { name = 'output.' + g.ext; mime = g.mime; }
    else if (decodeUtf8(bytes) !== null && out.dish && out.dish.type !== 3) { name = 'output.txt'; mime = 'text/plain'; }
    else { bytes = TE.encode(out.html); name = 'output.html'; mime = 'text/html'; }
  }
  else if (out.kind === 'text') { bytes = out.bytes; name = 'output.txt'; mime = 'text/plain'; }
  else if (out.kind === 'bytes') { const g = guessType(out.bytes); bytes = out.bytes; name = 'output.' + (g ? g.ext : 'bin'); mime = g ? g.mime : 'application/octet-stream'; }
  else { toast('Nothing to save yet'); return; }
  if (native) { native.call('saveFile', b64FromBytes(bytes), name, mime); return; }
  const a = el('a', { href: URL.createObjectURL(new Blob([bytes], { type: mime })), download: name }); document.body.append(a); a.click(); a.remove();
}
function setFile(name, bytes) {
  inputFile = { name, bytes };
  inputEl.hidden = true; $('#fileCard').hidden = false;
  $('#fileName').textContent = name; $('#fileMeta').textContent = bytesText(bytes.length);
}
function clearFile() { inputFile = null; inputEl.hidden = false; $('#fileCard').hidden = true; $('#fileInput').value = ''; }
$('#fileInput').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  if (f.size > 64 * 1024 * 1024) { toast('That file is larger than 64 MB, which is too big to open here.'); return; }
  setFile(f.name, new Uint8Array(await f.arrayBuffer())); schedule();
});

/* Shared from other apps */
window.receiveSharedText = t => { clearFile(); inputEl.value = t; schedule(); toast('Shared text added to input'); };
window.receiveSharedFile = async () => {
  if (!native) return;
  let r; try { r = JSON.parse(await native.call('takeSharedFile')); } catch { return; }
  if (r.error) { toast(r.error); return; }
  if (r.base64 != null) { setFile(r.name || 'shared file', bytesFromB64(r.base64)); schedule(); toast('Shared file opened'); }
};

/* ===================== QR scanner ===================== */
let scanStream = null, scanRaf = 0;
async function loadScript(src) { return new Promise((res, rej) => { const s = el('script', { src }); s.onload = res; s.onerror = rej; document.head.append(s); }); }
async function startScanner() {
  const video = el('video', { playsinline: true, muted: true, autoplay: true });
  const status = el('p', { class: 'meta', text: 'Point the camera at a QR code.' });
  info('Scan QR code', el('div', { class: 'scan' }, video, el('div', { class: 'frame' })), status,
    el('p', { class: 'meta', text: 'Have a QR code in a picture instead? Open the picture with Open file and add the “Parse QR Code” operation.' }));
  try {
    if (!window.jsQR) await loadScript(ENGINE + '/jsQR.js');
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
  } catch (e) {
    status.textContent = 'The camera is not available. Check that Cyber Master Chef is allowed to use the camera in your phone\'s settings.'; return;
  }
  video.srcObject = scanStream; await video.play().catch(() => {});
  const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
  const tick = () => {
    if (!scanStream) return;
    if (video.readyState >= 2 && video.videoWidth) {
      const scale = Math.min(1, 800 / Math.max(video.videoWidth, video.videoHeight));
      canvas.width = video.videoWidth * scale | 0; canvas.height = video.videoHeight * scale | 0;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'attemptBoth' });
      if (code && (code.data || (code.binaryData && code.binaryData.length))) {
        const text = code.data || decodeUtf8(new Uint8Array(code.binaryData));
        stopScanner(); closeSheets();
        if (text != null) { clearFile(); inputEl.value = text; } else setFile('QR code data', new Uint8Array(code.binaryData));
        schedule(); toast('QR code read into input'); window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
    }
    scanRaf = requestAnimationFrame(tick);
  };
  tick();
}
function stopScanner() { cancelAnimationFrame(scanRaf); if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; } }

/* ===================== Wiring ===================== */
inputEl.addEventListener('input', () => schedule());
$('#addBtn').onclick = openOpSheet;

$('#saveOutBtn').onclick = saveOutput;
$('#moveBtn').onclick = async () => {
  if (out.kind === 'none' || (out.kind === 'text' && !out.text)) { toast('Nothing to move yet'); return; }
  if (out.kind === 'bytes') setFile('previous output', out.bytes.slice());
  else if (out.kind === 'html') {
    const bytes = await rawOutputBytes(), t = guessType(bytes) ? null : decodeUtf8(bytes);
    if (t !== null) { clearFile(); inputEl.value = t; } else setFile('previous output', bytes);
  }
  else { clearFile(); inputEl.value = outputText(); }
  recipe = []; afterRecipeChange(); toast('Output moved to input, recipe cleared'); window.scrollTo({ top: 0, behavior: 'smooth' });
};
$('#appMenuBtn').onclick = e => { e.stopPropagation(); toggleMenu($('#appMenuBtn'), $('#appMenu')); };
$('#appMenu').addEventListener('click', e => {
  const m = e.target.dataset.m; if (!m) return; closeMenus();
  ({ saved: showSaved, import: showImport, export: showExport, about: showAbout })[m]();

/* Android back button: close menus and panels first, otherwise let the app close */
window.handleBack = () => { if (openMenu) { closeMenus(); return true; } return closeTop(); };

/* ===================== Start ===================== */
(async function init() {
  try {
    const data = await (await fetch(ENGINE + '/operations.json')).json();
    OPS = data.operations; CATS = data.categories; CC_VERSION = data.version;
    try { canvasJs = (await (await fetch(ENGINE + '/CanvasComponents.js')).text()).replace(/<\/script/gi, '<\\/script'); } catch {}
  } catch (e) {
    $('#opCount').textContent = ''; setNotice('err', "The CyberChef engine couldn't be loaded. Try reinstalling the app."); return;
  }
  $('#opCount').textContent = `${Object.keys(OPS).length} operations`;
  chef = new Chef(msg => { if (msg) $('#outMeta').innerHTML = '<span class="status"></span>', $('#outMeta .status').textContent = msg; });
  magicChef = new Chef();
  const saved = store.get('current', []);
  if (saved.length) setRecipeConfig(saved); else { renderRecipe(); schedule(); }
})();
